name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Tests + Dogfooding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 运行单元测试
        run: npm test
      - name: 用 aiscan 扫描自身源码（dogfooding）
        run: node bin/aiscan.js lib bin --severity=high
      - name: 扫描漏洞演示文件（应检出 11 项）
        run: node bin/aiscan.js fixtures/demo.js --quiet
