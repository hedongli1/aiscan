name: aiscan-patrol

on:
  schedule:
    # 推荐的巡检节律：UTC 17:00（北京时间次日 01:00）深夜低峰跑重型 clone + 全规则扫描
    # 为何选这个时间：
    #   - 与 trending-radar 晨报(UTC 00:30)/晚报(UTC 14:14)错峰，不抢 Search API 与 Actions 队列
    #   - 深夜 GitHub 流量低谷，clone 仓库与扫描更快更稳
    #   - 错开整点，避免全球 cron 排队高峰导致的延期
    # 自定义定时提示：
    #   - 每天一次: "0 17 * * *"   (UTC 17:00 = 北京次日 01:00)
    #   - 每天两次: "0 4,17 * * *" (UTC 04:00 与 17:00)
    #   - 每6小时:   "0 */6 * * *"
    #   - 每周一:    "0 17 * * 1"
    - cron: "0 17 * * *"
  workflow_dispatch: # 支持在 GitHub Actions 界面手动触发（随时按需执行）
    inputs:
      custom_targets:
        description: '临时自定义扫描目标（逗号分隔的 owner/repo，例如: expressjs/express,vuejs/core）'
        required: false
        default: ''
      severity:
        description: '最低警报级别过滤'
        required: false
        default: 'high'
        type: choice
        options:
          - critical
          - high
          - medium
          - low

permissions:
  issues: write
  contents: write # 巡检结果写入 docs/history/（供面板展示）
  pages: write
  id-token: write

jobs:
  patrol:
    name: 开源仓库安全巡检（只读）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # 凭据自检：PATROL_TOKEN 到期时会静默回落到 GITHUB_TOKEN，
      # 而 GITHUB_TOKEN 只能访问本仓库，无法读取 patrol 目标（其他仓库）。
      # 降级本身不会报错，只会让巡检范围悄悄缩水 —— 所以必须显式暴露。
      - name: 凭据自检（防止 PAT 到期后静默降级）
        env:
          PATROL_TOKEN: ${{ secrets.PATROL_TOKEN }}
        run: |
          if [ -z "$PATROL_TOKEN" ]; then
            echo "::warning title=巡检凭据已降级::未配置 PATROL_TOKEN，将回落到内置 GITHUB_TOKEN。内置 token 只能访问本仓库，无法读取其他仓库的巡检目标，本次巡检范围会大幅缩水。请检查 PATROL_TOKEN 是否已过期。"
          else
            CODE=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: token $PATROL_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/user)
            if [ "$CODE" = "200" ]; then
              echo "✅ PATROL_TOKEN 有效（GET /user → 200）"
            else
              echo "::error title=巡检凭据失效::PATROL_TOKEN 已失效（GET /user → $CODE，预期 200）。请到 https://github.com/settings/tokens 重新生成并更新仓库 Secret，否则巡检将静默回落到内置 token 并大幅缩水。"
            fi
          fi

      - name: 运行 aiscan 巡检（支持定时调度与手动自定义输入）
        env:
          GITHUB_TOKEN: ${{ secrets.PATROL_TOKEN || secrets.GITHUB_TOKEN }}
          CUSTOM_TARGETS: ${{ inputs.custom_targets }}
          SEV: ${{ inputs.severity || 'high' }}
        run: |
          set +e
          if [ -n "$CUSTOM_TARGETS" ]; then
            echo "🚀 使用手动自定义目标: $CUSTOM_TARGETS"
            node bin/aiscan.js --patrol-repo="$CUSTOM_TARGETS" --patrol-sev="$SEV" --json > /tmp/patrol-report.json 2> /tmp/patrol-output.txt
          else
            echo "⏰ 运行定时巡检计划 (配置自 patrol-targets.json)"
            node bin/aiscan.js --patrol-file=patrol-targets.json --patrol-sev="$SEV" --json > /tmp/patrol-report.json 2> /tmp/patrol-output.txt
          fi
          PATROL_EXIT=$?
          set -e
          cat /tmp/patrol-output.txt
          if [ "$PATROL_EXIT" = "2" ]; then
            echo "::error::patrol 工具运行出错"
            exit 2
          fi
          exit 0

      - name: 巡检摘要（run Summary 页）
        if: always()
        run: |
          {
            echo "## 🛡️ aiscan-patrol 巡检报告"
            echo ""
            echo "**时间**：$(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo '```'
            grep -E "自动发现|限额|待巡检|✅|🚨|↳|巡检汇总" /tmp/patrol-output.txt || echo "（无巡检输出）"
            echo '```'
            echo ""
            echo "完整结果见 [巡检面板](https://hedongli1.github.io/aiscan/)"
          } >> $GITHUB_STEP_SUMMARY

      - name: 结果写入面板数据（docs/history/）
        if: success()
        run: |
          DATE=$(date -u '+%Y-%m-%d')
          mkdir -p docs/history
          # 包一层元信息：日期 + 原始报告
          node -e "
            const raw = require('fs').readFileSync('/tmp/patrol-report.json', 'utf8');
            const m = raw.match(/===AISCAN_JSON_BEGIN===[\s\S]*?===AISCAN_JSON_END===/);
            if (!m) { console.error('未找到 JSON 哨兵'); process.exit(1); }
            const report = JSON.parse(m[0].replace(/===AISCAN_JSON_BEGIN===/, '').replace(/===AISCAN_JSON_END===/, '').trim());
            const out = { date: '${DATE}', generatedAt: new Date().toISOString(), report };
            require('fs').writeFileSync('docs/history/${DATE}.json', JSON.stringify(out, null, 2));
            console.log('已写入 docs/history/${DATE}.json');
          "
          # 只保留最近 30 天
          ls docs/history/*.json | sort | head -n -30 | xargs -r rm
          git config user.name "aiscan-patrol-bot"
          git config user.email "hedongli1@users.noreply.github.com"
          git add docs/history/
          git diff --cached --quiet || (git commit -m "chore(patrol): ${DATE} 巡检结果 [skip ci]" && git push)
          echo "面板数据已更新"

      - name: 触发 Pages 部署
        if: success()
        run: echo "Pages 会随 main 分支 docs/ 更新自动重新部署"
