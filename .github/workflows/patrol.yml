name: aiscan-patrol

on:
  schedule:
    - cron: "0 3 * * *" # 每日凌晨 3 点巡检 patrol-targets.json 里的第三方仓库（不扫自己账号）
  workflow_dispatch: # 支持手动触发

permissions:
  issues: write # 巡检 Issue（仅本仓库）
  contents: read # 读取代码

jobs:
  patrol:
    name: 第三方仓库安全巡检（只读）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 运行 aiscan 巡检（目标见 patrol-targets.json）
        env:
          GITHUB_TOKEN: ${{ secrets.PATROL_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set +e
          node bin/aiscan.js --patrol-file=patrol-targets.json --patrol-sev=high > /tmp/patrol-output.txt 2>&1
          PATROL_EXIT=$?
          set -e
          cat /tmp/patrol-output.txt
          if [ "$PATROL_EXIT" = "2" ]; then
            echo "::error::patrol 工具运行出错"
            exit 2
          fi
          exit 0

      - name: 巡检摘要（run Summary 页，手机可看）
        if: always()
        run: |
          {
            echo "## 🛡️ aiscan-patrol 第三方巡检报告"
            echo ""
            echo "**时间**：$(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo '```'
            grep -E "待巡检|✅|🚨|↳|巡检汇总" /tmp/patrol-output.txt || echo "（无巡检输出）"
            echo '```'
            echo ""
            echo "目标清单在 [patrol-targets.json](https://github.com/hedongli1/aiscan/blob/main/patrol-targets.json)（第三方只读，不开 Issue）。"
          } >> $GITHUB_STEP_SUMMARY
