<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub 安全工具发现库 · aiscan</title>
<style>
  :root{
    --bg:#080c18; --panel:rgba(255,255,255,.045); --line:rgba(255,255,255,.10);
    --txt:#eef2f7; --sub:#9db0ca; --dim:#6b7f9c; --gold:#fbbf24;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--txt);line-height:1.6;min-height:100vh;
    background:
      radial-gradient(1100px 520px at 12% -8%, rgba(56,189,248,.16), transparent 60%),
      radial-gradient(900px 480px at 92% 4%, rgba(139,92,246,.14), transparent 62%),
      linear-gradient(175deg,#080c18 0%,#0b1224 55%,#0a0f1e 100%);
    background-attachment:fixed;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:48px 22px 64px}

  /* ---------- header ---------- */
  header{text-align:center;margin-bottom:34px}
  .eyebrow{
    display:inline-block;font-size:12px;letter-spacing:3px;color:#67e8f9;
    border:1px solid rgba(103,232,249,.32);border-radius:999px;padding:5px 15px;margin-bottom:16px
  }
  h1{
    font-size:36px;font-weight:700;letter-spacing:-.5px;
    background:linear-gradient(92deg,#fff,#7dd3fc 45%,#a78bfa);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent
  }
  .sub{color:var(--sub);font-size:14px;margin-top:10px}
  .meta{margin-top:16px;display:flex;justify-content:center;gap:22px;flex-wrap:wrap;font-size:12.5px;color:var(--dim)}
  .meta b{color:#7dd3fc;font-weight:600}

  /* ---------- toolbar ---------- */
  .toolbar{
    position:sticky;top:0;z-index:20;display:flex;gap:10px;flex-wrap:wrap;align-items:center;
    padding:14px;margin:0 0 26px;border:1px solid var(--line);border-radius:14px;
    background:rgba(10,15,30,.82);backdrop-filter:blur(14px)
  }
  input[type=search],select{
    background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--txt);
    border-radius:10px;padding:9px 13px;font-size:13.5px;outline:none;font-family:inherit
  }
  input[type=search]{flex:1 1 260px;min-width:200px}
  input[type=search]:focus,select:focus{border-color:rgba(103,232,249,.55)}
  select{cursor:pointer}
  select option{background:#0d1426;color:var(--txt)}
  .chips{display:flex;gap:7px;flex-wrap:wrap;width:100%}
  .chip{
    font-size:12.5px;padding:5px 12px;border-radius:999px;cursor:pointer;user-select:none;
    border:1px solid var(--line);color:var(--sub);background:transparent;transition:.18s
  }
  .chip:hover{color:var(--txt)}
  .chip.on{color:#08111f;font-weight:700;border-color:transparent}
  .btn{
    font-size:12.5px;padding:7px 14px;border-radius:10px;cursor:pointer;font-family:inherit;
    border:1px solid var(--line);background:transparent;color:var(--sub)
  }
  .btn:hover{color:var(--txt);border-color:rgba(255,255,255,.28)}

  /* ---------- board ---------- */
  .cat{margin-bottom:38px}
  .cat-head{display:flex;align-items:center;gap:11px;margin-bottom:15px;flex-wrap:wrap}
  .cat-bar{width:4px;height:22px;border-radius:3px;background:var(--c)}
  .cat-head h2{font-size:19px;font-weight:700;color:#f8fafc}
  .cat-count{font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:1px 10px}
  .cat-queries{font-size:11.5px;color:var(--dim);width:100%;margin-top:-6px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:13px}
  .tool{
    background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--c);
    border-radius:12px;padding:15px 16px;transition:.2s;display:flex;flex-direction:column;gap:8px
  }
  .tool:hover{transform:translateY(-2px);background:rgba(255,255,255,.07);box-shadow:0 10px 26px rgba(0,0,0,.3)}
  .tool-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .tool a.name{font-size:15.5px;font-weight:700;color:#f8fafc;text-decoration:none;word-break:break-all}
  .tool a.name:hover{color:var(--c);text-decoration:underline;text-underline-offset:3px}
  .owner{color:var(--dim);font-weight:400;font-size:13px}
  .stars{flex-shrink:0;font-size:13px;font-weight:700;color:var(--gold);white-space:nowrap}
  .sum{font-size:13px;color:#cfdcec}
  .desc{font-size:12px;color:var(--dim);font-style:italic}
  .tool-foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:auto}
  .lang{font-size:11.5px;color:var(--sub);display:inline-flex;align-items:center;gap:5px}
  .dot{width:8px;height:8px;border-radius:50%;background:#64748b;display:inline-block}
  .upd{font-size:11.5px;color:var(--dim)}
  .tag{font-size:11px;padding:2px 9px;border-radius:999px;color:var(--c);border:1px solid currentColor;opacity:.9}

  .empty{text-align:center;color:var(--dim);padding:52px 0;font-size:14px;border:1px dashed var(--line);border-radius:14px}

  /* ---------- patrol ---------- */
  .patrol{margin-top:52px;border:1px solid var(--line);border-radius:16px;padding:22px;background:rgba(255,255,255,.028)}
  .patrol h2{font-size:17px;font-weight:700;color:#f8fafc;display:flex;align-items:center;gap:9px}
  .patrol h2 .pbar{width:4px;height:20px;border-radius:3px;background:#10b981}
  .patrol .hint{font-size:12px;color:var(--dim);margin:8px 0 16px}
  .pstats{display:flex;gap:30px;flex-wrap:wrap;margin-bottom:16px}
  .pstat{text-align:center;min-width:74px}
  .pstat .n{font-size:22px;font-weight:700;color:#34d399}
  .pstat .l{font-size:11.5px;color:var(--dim);margin-top:2px}
  .trend{display:flex;align-items:flex-end;gap:4px;height:52px;margin:10px 0 6px}
  .trend i{flex:1;min-width:5px;border-radius:2px 2px 0 0;background:linear-gradient(180deg,#34d399,#0f766e);display:block}
  .prow{font-size:12.5px;color:var(--sub);padding:6px 0;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap}
  .prow b{color:#fca5a5;font-weight:600}
  .plink{font-size:12px;color:#7dd3fc;text-decoration:none}
  .plink:hover{text-decoration:underline}

  footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);font-size:12px;color:var(--dim);text-align:center;line-height:2}
  footer a{color:#7dd3fc;text-decoration:none}
  @media(max-width:640px){
    .wrap{padding:30px 14px 48px}
    h1{font-size:27px}
    .grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">GITHUB TOOL RADAR</div>
    <h1>安全工具发现库</h1>
    <p class="sub">按方向检索 GitHub 上的开源安全工具 · 数据由 GitHub Actions 定时自动刷新</p>
    <div class="meta">
      <span>数据更新 <b id="m-updated">—</b></span>
      <span>收录 <b id="m-total">—</b></span>
      <span>方向 <b id="m-cats">—</b></span>
      <span>数据源 <b>GitHub Search API</b></span>
    </div>
  </header>

  <section class="toolbar">
    <input id="q" type="search" placeholder="搜索工具名 / 描述 / 标签（中英文均可）…">
    <select id="sort">
      <option value="stars">按 Star 降序</option>
      <option value="updated">按最近更新</option>
      <option value="name">按名称 A→Z</option>
    </select>
    <select id="lang"><option value="">全部语言</option></select>
    <button class="btn" id="reset">重置筛选</button>
    <div class="chips" id="cats"></div>
  </section>

  <main id="board"></main>
  <div class="empty" id="empty" hidden>没有匹配的工具，换个关键词或清空筛选试试</div>

  <section class="patrol">
    <h2><span class="pbar"></span>aiscan 开源仓库巡检状态</h2>
    <p class="hint">由 <code>.github/workflows/patrol.yml</code> 每日巡检，结果写入 <code>docs/history/</code></p>
    <div id="patrol-body"><span style="color:#6b7f9c;font-size:13px">加载中…</span></div>
  </section>

  <footer>
    数据来源：GitHub Search API（按关键词 + Star 排序检索仓库）· 页面为纯静态单文件，无外部依赖<br>
    仓库：<a href="https://github.com/hedongli1/aiscan" target="_blank" rel="noopener">hedongli1/aiscan</a>
  </footer>
</div>

<script>
const CAT_COLORS = {"ai-security":"#a78bfa","redteam":"#f87171","ics-iot":"#fbbf24","hunting-dfir":"#34d399","cloud-container":"#38bdf8","code-audit":"#f472b6"};
const BASE = JSON.parse(document.getElementById('base-data').textContent);
let DATA = BASE;

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const st = { q:'', sort:'stars', lang:'', cats:new Set() };

function allTools(){
  const out = [];
  (DATA.categories || []).forEach(c => (c.tools || []).forEach(t => out.push(Object.assign({catId:c.id, catName:c.name, color:c.color || CAT_COLORS[c.id]}, t))));
  return out;
}

function apply(list){
  const q = st.q.trim().toLowerCase();
  let r = list.filter(t => {
    if (st.cats.size && !st.cats.has(t.catId)) return false;
    if (st.lang && (t.language || '') !== st.lang) return false;
    if (!q) return true;
    const hay = [t.full_name, t.desc, t.summary, (t.tags || []).join(' '), t.language].join(' ').toLowerCase();
    return hay.includes(q);
  });
  const cmp = {
    stars: (a,b) => (b.stars||0)-(a.stars||0),
    updated: (a,b) => String(b.pushed_at||'').localeCompare(String(a.pushed_at||'')) || (b.stars||0)-(a.stars||0),
    name: (a,b) => String(a.full_name||'').toLowerCase().localeCompare(String(b.full_name||'').toLowerCase())
  }[st.sort];
  return r.sort(cmp);
}

function toolCard(t){
  const [owner, name] = String(t.full_name || '').split('/');
  const tags = (t.tags || []).map(x => '<span class="tag">' + esc(x) + '</span>').join('');
  const langDot = t.language ? '<span class="lang"><span class="dot"></span>' + esc(t.language) + '</span>' : '';
  return '<article class="tool">'
    + '<div class="tool-top"><a class="name" href="' + esc(t.url) + '" target="_blank" rel="noopener">'
    + esc(name || t.full_name) + '<span class="owner"> / ' + esc(owner) + '</span></a>'
    + '<span class="stars">' + (t.stars >= 0 ? '★ ' + Number(t.stars).toLocaleString() : '') + '</span></div>'
    + (t.summary ? '<p class="sum">' + esc(t.summary) + '</p>' : '')
    + (t.desc && !t.summary ? '<p class="desc">' + esc(t.desc) + '</p>' : '')
    + '<div class="tool-foot">' + langDot
    + (t.pushed_at ? '<span class="upd">更新 ' + esc(t.pushed_at) + '</span>' : '')
    + tags + '</div></article>';
}

function renderChips(){
  const cats = DATA.categories || [];
  $('#cats').innerHTML = cats.map(c => {
    const col = c.color || CAT_COLORS[c.id] || '#94a3b8';
    const on = st.cats.has(c.id);
    return '<span class="chip' + (on ? ' on' : '') + '" data-cat="' + esc(c.id) + '" data-c="' + esc(col) + '"'
      + (on ? ' style="background:' + col + '"' : ' style="border-color:' + col + '55;color:' + col + '"') + '>'
      + esc(c.name) + ' ' + ((c.tools || []).length) + '</span>';
  }).join('');
  document.querySelectorAll('.chip').forEach(el => el.onclick = () => {
    const id = el.dataset.cat;
    st.cats.has(id) ? st.cats.delete(id) : st.cats.add(id);
    renderChips(); render();
  });
}

function render(){
  const cats = DATA.categories || [];
  const m = DATA.meta || {};
  $('#m-updated').textContent = m.updated_at || '—';
  const total = cats.reduce((n,c) => n + ((c.tools||[]).length), 0);
  $('#m-total').textContent = (m.total || total) + ' 个工具';
  $('#m-cats').textContent = cats.length + ' 个';

  // 语言下拉
  const langs = [...new Set(allTools().map(t => t.language).filter(Boolean))].sort();
  const sel = $('#lang');
  if (sel.options.length - 1 !== langs.length){
    sel.innerHTML = '<option value="">全部语言</option>' + langs.map(l => '<option' + (l === st.lang ? ' selected' : '') + '>' + esc(l) + '</option>').join('');
  }

  const picked = new Set([...st.cats]);
  if (st.q.trim()) cats.forEach(c => picked.add(c.id));

  const html = cats.filter(c => !st.cats.size || st.cats.has(c.id)).map(c => {
    const list = apply((c.tools||[]).map(t => Object.assign({catId:c.id}, t)));
    if (!list.length) return '';
    const col = c.color || CAT_COLORS[c.id] || '#94a3b8';
    return '<section class="cat" style="--c:' + col + '">'
      + '<div class="cat-head"><span class="cat-bar"></span><h2>' + esc(c.name) + '</h2>'
      + '<span class="cat-count">' + list.length + ' / ' + (c.tools||[]).length + '</span>'
      + (c.queries ? '<span class="cat-queries">检索词：' + esc(c.queries.join(' · ')) + '</span>' : '')
      + '</div><div class="grid">' + list.map(toolCard).join('') + '</div></section>';
  }).join('');

  $('#board').innerHTML = html;
  const any = cats.some(c => (!st.cats.size || st.cats.has(c.id)) && apply((c.tools||[]).map(t => Object.assign({catId:c.id}, t))).length);
  $('#empty').hidden = any;
}

/* ---- 巡检状态 ---- */
async function patrol(){
  const box = $('#patrol-body');
  let days = null, updatedAt = null;
  try {
    const r = await fetch('data/patrol-index.json', {cache:'no-store'});
    if (r.ok){ const j = await r.json(); if (j && j.days && j.days.length){ days = j.days; updatedAt = j.updatedAt || null; } }
  } catch(e){}
  if (!days){
    const got = [];
    const now = Date.now();
    for (let i = 0; i < 12 && got.length < 6; i++){
      const d = new Date(now - i * 864e5).toISOString().slice(0,10);
      try {
        const r = await fetch('history/' + d + '.json', {cache:'no-store'});
        if (r.ok){
          const j = await r.json(), rp = j.report || {};
          got.push({date: j.date || d, scanned: rp.scanned||0, clean: rp.cleanRepos||0,
                    flagged: (rp.flaggedRepos||[]).length, issues: rp.issuesOpened||0, errors: (rp.errors||[]).length});
        }
      } catch(e){}
    }
    if (got.length) days = got;
  }
  if (!days || !days.length){
    box.innerHTML = '<span style="color:#6b7f9c;font-size:13px">暂无巡检数据 —— patrol workflow 跑完首轮后此处会显示最近一次巡检统计与近 30 天趋势。</span>';
    return;
  }
  days = days.slice().sort((a,b) => String(b.date).localeCompare(String(a.date)));
  const last = days[0];
  const maxF = Math.max(1, ...days.map(d => d.flagged || 0));
  const trend = days.slice().reverse().map(d => '<i title="' + esc(d.date) + '：' + (d.flagged||0) + ' 仓库命中" style="height:' + Math.max(4, Math.round((d.flagged||0)/maxF*100)) + '%"></i>').join('');
  const rows = days.slice(0, 7).map(d =>
    '<div class="prow"><span>' + esc(d.date) + '</span><span>扫描 ' + (d.scanned||0) + '</span>'
    + '<b>命中 ' + (d.flagged||0) + '</b><span>无风险 ' + (d.clean||0) + '</span>'
    + (d.issues ? '<span>已开 issue ' + d.issues + '</span>' : '')
    + '<a class="plink" href="history/' + esc(d.date) + '.json" target="_blank" rel="noopener">查看报告</a></div>').join('');
  box.innerHTML =
    '<div class="pstats">'
    + '<div class="pstat"><div class="n">' + (last.scanned||0) + '</div><div class="l">最近扫描仓库</div></div>'
    + '<div class="pstat"><div class="n">' + (last.flagged||0) + '</div><div class="l">命中风险</div></div>'
    + '<div class="pstat"><div class="n">' + (last.clean||0) + '</div><div class="l">无风险</div></div>'
    + '<div class="pstat"><div class="n">' + days.length + '</div><div class="l">已有报告天数</div></div>'
    + '</div>'
    + '<div style="font-size:12px;color:#6b7f9c">最近一次：' + esc(last.date) + '</div>'
    + '<div class="trend">' + trend + '</div>'
    + '<div style="font-size:11.5px;color:#6b7f9c;margin-bottom:12px">近 ' + days.length + ' 次巡检命中趋势</div>'
    + rows;
}

/* ---- 事件 ---- */
$('#q').oninput = e => { st.q = e.target.value; render(); };
$('#sort').onchange = e => { st.sort = e.target.value; render(); };
$('#lang').onchange = e => { st.lang = e.target.value; render(); };
$('#reset').onclick = () => { st.q=''; st.sort='stars'; st.lang=''; st.cats.clear(); $('#q').value=''; $('#sort').value='stars'; $('#lang').value=''; renderChips(); render(); };

(async () => {
  try {
    const r = await fetch('data/tools.json', {cache:'no-store'});
    if (r.ok){ const j = await r.json(); if (j && j.categories && j.categories.length) DATA = j; }
  } catch(e){}
  renderChips(); render(); patrol();
})();
</script>
